<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Dr. Raul Sucari Cruz">
  <!-- Marca personal del Dr. Raul Sucari Cruz.
       Conserva el gesto del logo del consultorio (anillo navy → dorado)
       pero sin texto: la categoría del establecimiento no puede
       anunciarse (ver CLAUDE.md, restricción R2). -->
  <defs>
    <linearGradient id="marcaAnillo" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#02164A"/>
      <stop offset="0.38" stop-color="#1B3468"/>
      <stop offset="0.68" stop-color="#B98D24"/>
      <stop offset="1" stop-color="#FFC401"/>
    </linearGradient>
    <linearGradient id="marcaOro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="0.55" stop-color="#F9C536"/>
      <stop offset="1" stop-color="#C48C0E"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#marcaAnillo)" stroke-width="6"/>

  <!-- Punto que remata el anillo, como el que orbita en la portada -->
  <circle cx="60" cy="6" r="4.6" fill="#FFC401"/>

  <g transform="translate(23 18) scale(1.15)">
    <path d="M22 14c-5.5 0-9 4.5-9 10.5 0 10 4.5 20.5 8 27 1.4 2.7 5 2 5.4-1 .5-4.4 1.4-11 5.6-11s5.1 6.6 5.6 11c.4 3 4 3.7 5.4 1 3.5-6.5 8-17 8-27C51 18.5 47.5 14 42 14c-4.3 0-6 2.6-10 2.6S26.3 14 22 14Z"
          fill="none" stroke="url(#marcaOro)" stroke-width="4.2" stroke-linejoin="round"/>
  </g>
</svg>
